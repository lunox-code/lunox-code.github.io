<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f2e8;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 15%, #ffe36a 0, transparent 34%),
        radial-gradient(ellipse at 90% 85%, #f8d84e 0, transparent 30%),
        #f5f2e8;
    }

    main {
      width: min(100%, 440px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid #e8e1cd;
      border-top: 6px solid #f4ca19;
      border-radius: 18px;
      background: #fffefa;
      box-shadow: 0 20px 55px rgb(23 23 23 / 12%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 7vw, 2.5rem);
      letter-spacing: -0.06em;
    }

    main > p {
      margin: 0 0 28px;
      color: #5e5a4f;
      line-height: 1.6;
    }

    form p {
      margin: 0 0 20px;
    }

    label {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #c9c4b8;
      border-radius: 8px;
      background: #fff;
      color: #171717;
      font: inherit;
    }

    input:focus-visible {
      outline: 3px solid #f4ca19;
      outline-offset: 2px;
      border-color: #171717;
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: #171717;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #363016;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #f4ca19;
      outline-offset: 3px;
    }

    a {
      color: #554400;
      font-weight: 700;
    }

    a:focus-visible {
      outline: 3px solid #f4ca19;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p>Sign up to get started.</p>

    <form action="#" method="post">
      <p>
        <label for="full-name">Full name</label><br>
        <input
          type="text"
          id="full-name"
          name="full-name"
          autocomplete="name"
          required
        >
      </p>

      <p>
        <label for="email">Email address</label><br>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >
      </p>

      <p>
        <label for="password">Password</label><br>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </p>

      <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="login.html">Log in</a></p>
    <p><a href="index.html">Back to home</a></p>
  </main>
</body>
</html>
